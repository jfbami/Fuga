name: iOS build and voice assets
on:
  push:
    branches: [codex/juno-native-fix, codex/navigation-alignment-fix, nav/route-guidance]
  pull_request:
    paths: ['Fuga/**', 'Fuga.xcodeproj/**', 'Config/**', 'tests/**', '.github/workflows/ios-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Guidance logic
        run: |
          swiftc Fuga/Guidance/VoiceCue.swift Fuga/Guidance/OffCourseHaptics.swift Fuga/Navigation/NavigationAccess.swift tests/main.swift -o /tmp/fuga-tests
          /tmp/fuga-tests
          swiftc -D DEBUG Fuga/Guidance/VoiceCue.swift Fuga/Guidance/OffCourseHaptics.swift Fuga/Navigation/NavigationAccess.swift tests/main.swift -o /tmp/fuga-debug-tests
          /tmp/fuga-debug-tests
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Alignment geometry regressions
        run: |
          swiftc Fuga/Navigation/RouteTracker.swift Fuga/Navigation/Route.swift Fuga/Navigation/HallwayGraph.swift Fuga/Navigation/PlanAlignment.swift tests/alignment/main.swift -o /tmp/fuga-alignment-tests
          /tmp/fuga-alignment-tests
      - name: Build native iOS app
        run: xcodebuild -project Fuga.xcodeproj -scheme Fuga -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/fuga-build CODE_SIGNING_ALLOWED=NO build
      - name: Check bundled Juno audio
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path('Fuga/Guidance/VoiceCue.swift').read_text()
          cues = re.findall(r'case \.(\w+): return "', source)
          app = Path('/tmp/fuga-build/Build/Products/Debug-iphonesimulator/Fuga.app')
          for cue in cues:
              name = f'fuga_{cue}.mp3'
              candidates = [app / name, app / 'VoiceAudio' / name]
              assert any(p.is_file() and p.stat().st_size > 1000 for p in candidates), name
          print(f'All {len(cues)} Juno clips packaged at supported lookup paths')
          PY
