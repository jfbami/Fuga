# Fallback: regenerate Fuga.xcodeproj with XcodeGen if the committed project won't open.
name: Fuga
options:
  bundleIdPrefix: edu.uw.dubhacks
  deploymentTarget:
    iOS: "17.0"
targets:
  Fuga:
    type: application
    platform: iOS
    sources: [Fuga]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.uw.dubhacks.fuga
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fuga
        INFOPLIST_KEY_NSCameraUsageDescription: "Fuga uses the camera to follow where you are in the building and guide you to your room."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"Fuga/Preview Content\""
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
